# Create an environment using:
# $ conda env create --name <env> --file <this file>
# platform: linux-64

name: gvhop
channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.11
  - pandas
  - numpy
  - hmmer=3.4
  - diamond=2.1.14
  - scikit-learn=1.6.1
  - xgboost=3.0.1
  - biopython=1.85
  - natsort
  - joblib
  - pytorch